name: Dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Audit installed third-party dependencies
        shell: bash
        run: |
          python -m pip list --format=freeze --exclude lynvera-ragparity > /tmp/ragparity-dependencies.txt
          pip-audit --requirement /tmp/ragparity-dependencies.txt --no-deps --disable-pip
